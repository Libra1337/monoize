[package]
name = "apeiron-server"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(embed_frontend)'] }

[dependencies]
axum = { version = "0.8.8", features = ["macros", "multipart", "ws"] }
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6.8", features = ["trace", "set-header", "limit"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "chrono", "uuid"] }
reqwest = { version = "0.13.1", default-features = false, features = ["json", "stream", "rustls-native-certs", "charset", "http2", "system-proxy", "multipart", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["arbitrary_precision", "raw_value"] }
uuid = { version = "1.19.0", features = ["v4"] }
chrono = { version = "0.4.42", features = ["serde"] }
sha2 = "0.11.0"
hmac = "0.13.0"
base64 = "0.22.1"
percent-encoding = "2.3.1"
include_dir = "0.7.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3.31"
tokio-stream = { version = "0.1.18", features = ["sync"] }

[profile.release]
opt-level = 2
