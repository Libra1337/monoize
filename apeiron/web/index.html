<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apeiron · 无界的视频画布</title>
    <meta name="description" content="公元前六世纪,阿那克西曼德说,万物生于无限定。两千六百年后,无限终于有了自己的画布。一句话生成成片,或在无限节点画布上编排每个环节。" />
    <meta name="theme-color" content="#0a0a0a" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("apeiron-theme");
          var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.background = dark ? "hsl(0 0% 4%)" : "hsl(0 0% 98%)";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
