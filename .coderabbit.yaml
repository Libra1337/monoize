# CodeRabbit configuration — https://docs.coderabbit.ai/reference/configuration
language: zh-CN
early_access: false
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  path_filters:
    - "!**/Cargo.lock"
    - "!**/bun.lock"
    - "!**/package-lock.json"
    - "!**/pnpm-lock.yaml"
    - "!**/dist/**"
    - "!**/node_modules/**"
chat:
  auto_reply: true
